name: ezybill
description: "EzyBill - Cable TV Billing Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.1.0

  # Networking
  dio: ^5.8.0+1
  http: ^1.2.1
  connectivity_plus: ^7.0.0

  # Device Info
  device_info_plus: ^11.1.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0

  # Maps & Location
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.2

  # Bluetooth — Classic BT SPP/RFCOMM for thermal printers
  print_bluetooth_thermal: ^1.1.3

  # Image Picker
  image_picker: ^1.1.2

  # Scanner
  mobile_scanner: ^7.2.0

  # Charts
  fl_chart: ^1.2.0

  # Utils
  intl: ^0.20.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  printing: ^5.14.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1
  custom_lint:
  riverpod_lint: ^3.1.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
